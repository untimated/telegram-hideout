<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GossipBoy Hideout</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      --ink: #fff8ee;
      --panel: rgba(20, 15, 34, .72);
      --panel-border: rgba(255, 255, 255, .26);
      --accent: #ffca71;
      --safe-top: max(18px, env(safe-area-inset-top));
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #17213c; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #app { position: relative; width: 100%; height: 100dvh; min-height: 420px; isolation: isolate; }
    #scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 24%, rgba(255, 167, 126, .38), transparent 28%),
        linear-gradient(155deg, #3b4f81 0%, #573d75 48%, #1d2647 100%);
    }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #scene canvas:active { cursor: grabbing; }
    #scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(16, 12, 31, .08), transparent 40%, rgba(10, 9, 20, .42)),
        radial-gradient(circle at center, transparent 38%, rgba(8, 10, 24, .25) 100%);
    }

    .hud { position: absolute; inset: 0; color: var(--ink); pointer-events: none; text-shadow: 0 2px 12px rgba(0, 0, 0, .4); }
    .hud button, .hud input { pointer-events: auto; }

    .room {
      position: absolute;
      top: var(--safe-top);
      left: 24px;
      display: grid;
      gap: 5px;
      font-weight: 800;
      letter-spacing: .01em;
    }
    .room-name { font-size: clamp(17px, 2.6vw, 22px); text-decoration: underline; text-underline-offset: 5px; }
    .clock-row { display: flex; align-items: center; gap: 9px; font-size: clamp(15px, 2.2vw, 19px); }
    .diamond { width: 14px; height: 14px; border: 3px solid currentColor; transform: rotate(45deg); }

    #status {
      position: absolute;
      top: var(--safe-top);
      left: 50%;
      translate: -50% 0;
      max-width: min(46vw, 420px);
      padding: 9px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(17, 16, 33, .58);
      backdrop-filter: blur(14px);
      color: rgba(255, 248, 238, .82);
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status.connected { color: #d8ffd0; border-color: rgba(174, 255, 153, .4); }
    #status.error { color: #ffd1c9; border-color: rgba(255, 123, 111, .58); }

    .debug-panel {
      position: absolute;
      top: 118px;
      left: 24px;
      width: min(260px, 31vw);
      min-width: 190px;
      max-height: 42vh;
      padding: 14px 15px;
      overflow: hidden;
      border: 2px solid rgba(255, 202, 113, .72);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 16px 48px rgba(6, 5, 16, .3), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(12px);
    }
    .debug-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    #debug { display: grid; gap: 5px; font: 600 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .debug-line { overflow-wrap: anywhere; }
    .debug-line.server { color: #c8ffba; }
    .debug-line.chat { color: #ffd59b; }
    .debug-line.muted { color: rgba(255, 255, 255, .55); }

    #interaction {
      position: absolute;
      top: 19%;
      left: 50%;
      translate: -50% 0;
      padding: 9px 18px;
      border: 2px solid rgba(255, 255, 255, .7);
      border-radius: 10px;
      color: rgba(255, 255, 255, .76);
      background: rgba(16, 13, 31, .28);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    #reticle { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
      translate: -50% -50%; border-radius: 50%; background: #fff8ee; opacity: .7; }

    #bubble {
      position: absolute;
      top: 24%;
      right: 8%;
      width: min(290px, 38vw);
      min-height: 92px;
      padding: 18px 20px;
      display: grid;
      place-items: center;
      border: 3px solid white;
      border-radius: 28px;
      background: rgba(26, 18, 43, .44);
      box-shadow: 0 14px 42px rgba(5, 5, 15, .28);
      backdrop-filter: blur(9px);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      transform: translateY(8px) scale(.97);
      transition: opacity .2s ease, transform .2s ease;
    }
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: 30%;
      width: 30px;
      height: 30px;
      border-right: 3px solid white;
      border-bottom: 3px solid white;
      background: rgba(26, 18, 43, .44);
      transform: rotate(45deg);
    }
    #bubble.visible { opacity: 1; transform: none; }

    .movement {
      position: absolute;
      left: 24px;
      bottom: calc(var(--safe-bottom) + 76px);
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 6px;
    }
    .move {
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, .84);
      border-radius: 14px;
      background: rgba(20, 15, 34, .62);
      color: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
      backdrop-filter: blur(10px);
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    .move:active { transform: translateY(2px) scale(.96); background: rgba(255, 123, 111, .72); }
    .move:disabled { opacity: .36; cursor: default; }
    .move[data-direction="up"] { grid-column: 2; grid-row: 1; }
    .move[data-direction="left"] { grid-column: 1; grid-row: 2; }
    .move[data-direction="down"] { grid-column: 2; grid-row: 2; }
    .move[data-direction="right"] { grid-column: 3; grid-row: 2; }

    #chat-form {
      position: absolute;
      left: 50%;
      bottom: var(--safe-bottom);
      translate: -50% 0;
      display: flex;
      gap: 8px;
      width: min(580px, calc(100% - 40px));
      padding: 7px;
      border: 2px solid rgba(255, 255, 255, .78);
      border-radius: 15px;
      background: rgba(21, 17, 38, .68);
      box-shadow: 0 14px 42px rgba(4, 5, 14, .34);
      backdrop-filter: blur(14px);
    }
    #message {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 9px 11px;
      background: transparent;
      color: white;
    }
    #message::placeholder { color: rgba(255, 255, 255, .56); }
    #send {
      width: 44px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #352039;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }
    #send:disabled, #message:disabled { opacity: .42; }

    @media (max-width: 620px) {
      .room { left: 16px; }
      #status { top: calc(var(--safe-top) + 64px); max-width: calc(100% - 32px); }
      .debug-panel { top: 118px; left: 16px; width: 186px; min-width: 0; max-height: 34vh; padding: 11px; }
      #interaction { top: auto; left: auto; right: 16px; bottom: calc(var(--safe-bottom) + 85px);
        translate: none; max-width: 145px; padding: 8px; font-size: 11px; }
      #bubble { top: 25%; right: 16px; width: min(225px, 55vw); }
      .movement { left: 16px; bottom: calc(var(--safe-bottom) + 76px); grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); }
      #chat-form { width: calc(100% - 32px); }
    }
  </style>
</head>
<body>
  <main id="app">
    <div id="scene" aria-hidden="true"></div>
    <div class="hud">
      <header class="room">
        <div class="room-name">Gossip Bar</div>
        <div class="clock-row"><span id="clock">time --:--</span><span class="diamond"></span></div>
      </header>

      <div id="status" role="status">Starting Hideout…</div>

      <section class="debug-panel" aria-label="Server input log">
        <div class="debug-title"><span>input log</span><span>server</span></div>
        <div id="debug" role="log" aria-live="polite"></div>
      </section>

      <div id="interaction">Drag the scene to look · WASD / arrows to move</div>
      <div id="reticle" aria-hidden="true"></div>
      <div id="bubble" role="status" aria-live="polite"></div>

      <nav class="movement" aria-label="Movement controls">
        <button class="move" type="button" data-direction="up" aria-label="Move forward" disabled>↑</button>
        <button class="move" type="button" data-direction="left" aria-label="Strafe left" disabled>←</button>
        <button class="move" type="button" data-direction="down" aria-label="Move backward" disabled>↓</button>
        <button class="move" type="button" data-direction="right" aria-label="Strafe right" disabled>→</button>
      </nav>

      <form id="chat-form">
        <input id="message" maxlength="500" autocomplete="off" placeholder="Say something…" aria-label="Chat message" required disabled>
        <button id="send" aria-label="Send message" disabled>➜</button>
      </form>
    </div>
  </main>

  <script>
    const status = document.getElementById('status');
    const debug = document.getElementById('debug');
    const bubble = document.getElementById('bubble');
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const moveButtons = [...document.querySelectorAll('.move')];
    const guestMode = new URLSearchParams(location.search).get('guest') === '1';
    const moveLabel = {
      up: 'Forward',
      down: 'Backward',
      left: 'Strafe left',
      right: 'Strafe right',
    };
    let socket;
    let bubbleTimer;
    let world;
    let selfID;
    const playerState = new Map();
    let yaw = 0;
    let pitch = -.12;
    const heldDirections = new Map();
    let movementTimer;
    let lastMoveAt = -Infinity;
    const moveInterval = 200;
    const moveStep = .3;
    const walkSpeed = moveStep * 1000 / moveInterval;

    function applyMove(position, direction, heading, distance) {
      const forward = direction === 'up' ? -distance : direction === 'down' ? distance : 0;
      const strafe = direction === 'left' ? -distance : direction === 'right' ? distance : 0;
      return {
        x: Math.max(-4, Math.min(4, position.x + strafe * Math.cos(heading) + forward * Math.sin(heading))),
        z: Math.max(-3, Math.min(3, position.z - strafe * Math.sin(heading) + forward * Math.cos(heading))),
      };
    }

    function setStatus(text, state = '') {
      status.textContent = text;
      status.className = state;
    }

    function addDebug(text, kind = '') {
      const line = document.createElement('div');
      line.className = `debug-line ${kind}`;
      line.textContent = text;
      debug.append(line);
      while (debug.children.length > 11) debug.firstElementChild.remove();
    }

    function showBubble(name, text) {
      bubble.textContent = `${name}: ${text}`;
      bubble.classList.add('visible');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove('visible'), 4200);
    }

    function setConnected(connected) {
      input.disabled = send.disabled = !connected;
      for (const button of moveButtons) button.disabled = !connected;
      if (!connected) stopAllMovement();
    }

    function upsertPlayer(player) {
      if (!player || typeof player.id !== 'string') return;
      playerState.set(player.id, player);
      world?.upsertPlayer(player);
    }

    function removePlayer(id) {
      playerState.delete(id);
      world?.removePlayer(id);
    }

    async function startThree() {
      try {
        const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
        const host = document.getElementById('scene');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x171d33);
        scene.fog = new THREE.Fog(0x171d33, 11, 24);
        const eyeHeight = 1.25;
        const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 50);
        camera.position.set(0, eyeHeight, 0);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        host.prepend(renderer.domElement);
        let lookPointer;
        function stopLooking() {
          if (lookPointer && renderer.domElement.hasPointerCapture(lookPointer.id)) {
            renderer.domElement.releasePointerCapture(lookPointer.id);
          }
          lookPointer = undefined;
        }
        renderer.domElement.addEventListener('pointerdown', event => {
          if (lookPointer || event.button !== 0) return;
          input.blur();
          lookPointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
          renderer.domElement.setPointerCapture(event.pointerId);
          event.preventDefault();
        });
        renderer.domElement.addEventListener('pointermove', event => {
          if (event.pointerId !== lookPointer?.id) return;
          yaw -= (event.clientX - lookPointer.x) * .005;
          yaw = Math.atan2(Math.sin(yaw), Math.cos(yaw));
          pitch = Math.max(-1.25, Math.min(1.25, pitch - (event.clientY - lookPointer.y) * .005));
          lookPointer.x = event.clientX;
          lookPointer.y = event.clientY;
        });
        for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
          renderer.domElement.addEventListener(eventName, event => {
            if (event.pointerId === lookPointer?.id) stopLooking();
          });
        }
        window.addEventListener('blur', stopLooking);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stopLooking();
        });

        scene.add(new THREE.HemisphereLight(0xbfd7ff, 0x46334f, 2.2));
        const sun = new THREE.DirectionalLight(0xffd7ac, 2.8);
        sun.position.set(-4, 8, 5);
        sun.castShadow = true;
        scene.add(sun);

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(9, 7),
          new THREE.MeshStandardMaterial({ color: 0x716b83, roughness: .88, metalness: .04 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(9, 18, 0xb29dbf, 0x82768f);
        grid.scale.z = 7 / 9;
        grid.position.y = .012;
        grid.material.opacity = .32;
        grid.material.transparent = true;
        scene.add(grid);

        function addWall(x, z, width, depth, height = .65) {
          const wall = new THREE.Mesh(
            new THREE.BoxGeometry(width, height, depth),
            new THREE.MeshStandardMaterial({ color: 0x4a4967, roughness: .72 }),
          );
          wall.position.set(x, height / 2, z);
          wall.castShadow = wall.receiveShadow = true;
          scene.add(wall);
        }
        addWall(0, -3.55, 9.4, .28);
        addWall(-4.55, 0, .28, 7.4);
        addWall(4.55, 0, .28, 7.4);
        addWall(0, 3.55, 9.4, .28, .26);

        for (const x of [-3.7, 3.7]) {
          for (const z of [-2.75, 2.75]) {
            const lamp = new THREE.PointLight(0xffa66e, 8, 5, 2);
            lamp.position.set(x, 1.2, z);
            scene.add(lamp);
          }
        }

        const objects = new Map();

        function colorFor(name) {
          let hash = 0;
          for (const character of name) hash = (hash * 31 + character.charCodeAt(0)) | 0;
          return `hsl(${Math.abs(hash) % 360}, 58%, 48%)`;
        }

        function avatarTexture(player) {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 256;
          const context = canvas.getContext('2d');
          const drawFrame = () => {
            context.lineWidth = 14;
            context.strokeStyle = '#fff8ee';
            context.beginPath();
            context.arc(128, 128, 112, 0, Math.PI * 2);
            context.stroke();
          };
          context.fillStyle = colorFor(player.name);
          context.beginPath();
          context.arc(128, 128, 112, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = '#fff8ee';
          context.font = '800 78px system-ui';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText(player.name.replace(/^@/, '').slice(0, 2).toUpperCase(), 128, 132);
          drawFrame();
          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          const sources = [player.avatarURL, player.photoURL].filter(Boolean);
          if (sources.length) {
            const image = new Image();
            let disposed = false;
            let objectURL;
            function releaseImageURL() {
              if (objectURL) URL.revokeObjectURL(objectURL);
              objectURL = undefined;
            }
            texture.addEventListener('dispose', () => {
              disposed = true;
              image.onload = image.onerror = null;
              releaseImageURL();
            });
            image.referrerPolicy = 'no-referrer';
            image.onload = () => {
              if (disposed || !image.naturalWidth || !image.naturalHeight) return;
              context.save();
              context.clearRect(0, 0, 256, 256);
              context.beginPath();
              context.arc(128, 128, 105, 0, Math.PI * 2);
              context.clip();
              const size = Math.min(image.naturalWidth, image.naturalHeight);
              const sx = (image.naturalWidth - size) / 2;
              const sy = (image.naturalHeight - size) / 2;
              context.drawImage(image, sx, sy, size, size, 16, 16, 224, 224);
              context.restore();
              drawFrame();
              texture.needsUpdate = true;
              releaseImageURL();
              addDebug(`avatar: ${player.name} photo loaded`, 'muted');
            };
            image.onerror = () => {
              if (disposed) return;
              releaseImageURL();
              loadNext();
            };
            async function loadNext() {
              if (disposed) return;
              const source = sources.shift();
              if (!source) {
                addDebug(`avatar: ${player.name} using initials (photo unavailable)`, 'muted');
                return;
              }
              if (source.startsWith('/avatars/')) {
                try {
                  const response = await fetch(source, { credentials: 'same-origin' });
                  if (disposed) return;
                  if (!response.ok) {
                    addDebug(`avatar: ${player.name} photo HTTP ${response.status}`, 'muted');
                    loadNext();
                    return;
                  }
                  objectURL = URL.createObjectURL(await response.blob());
                  if (disposed) { releaseImageURL(); return; }
                  image.src = objectURL;
                } catch {
                  loadNext();
                }
              } else {
                image.crossOrigin = 'anonymous';
                image.src = source;
              }
            }
            loadNext();
          }
          return texture;
        }

        function labelTexture(name) {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 96;
          const context = canvas.getContext('2d');
          context.fillStyle = 'rgba(20, 15, 34, .82)';
          context.beginPath();
          context.roundRect(8, 8, 496, 80, 30);
          context.fill();
          context.strokeStyle = 'rgba(255, 248, 238, .72)';
          context.lineWidth = 5;
          context.stroke();
          context.fillStyle = '#fff8ee';
          context.font = '700 34px system-ui';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText(name, 256, 49, 450);
          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          return texture;
        }

        function createPlayer(player) {
          const group = new THREE.Group();
          group.position.set(player.x, 0, player.z);
          group.userData.target = new THREE.Vector3(player.x, 0, player.z);

          const shadow = new THREE.Mesh(
            new THREE.CircleGeometry(.34, 32),
            new THREE.MeshBasicMaterial({ color: 0x080912, transparent: true, opacity: .34, depthWrite: false }),
          );
          shadow.rotation.x = -Math.PI / 2;
          shadow.position.y = .02;
          group.add(shadow);

          const ring = new THREE.Mesh(
            new THREE.RingGeometry(.36, .42, 32),
            new THREE.MeshBasicMaterial({ color: 0x91a0c8, side: THREE.DoubleSide }),
          );
          ring.rotation.x = -Math.PI / 2;
          ring.position.y = .035;
          ring.userData.localMarker = true;
          group.add(ring);

          const body = new THREE.Mesh(
            new THREE.CapsuleGeometry(.27, .87, 4, 12),
            new THREE.MeshStandardMaterial({ color: colorFor(player.name), roughness: .72, metalness: .04 }),
          );
          body.position.y = .73;
          body.castShadow = true;
          body.receiveShadow = true;
          group.add(body);

          const avatar = new THREE.Sprite(new THREE.SpriteMaterial({
            map: avatarTexture(player),
            transparent: true,
            alphaTest: .02,
          }));
          avatar.position.y = 1.62;
          avatar.scale.set(.58, .58, 1);
          group.add(avatar);
          group.userData.avatar = avatar;
          group.userData.avatarKey = `${player.avatarURL ?? ''}|${player.photoURL ?? ''}`;

          const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTexture(player.name), transparent: true }));
          label.position.y = 2.05;
          label.scale.set(1.35, .26, 1);
          group.add(label);
          scene.add(group);
          return group;
        }

        function setLocalPlayer(id) {
          for (const [playerID, group] of objects) {
            group.visible = playerID !== id;
            const ring = group.children.find(child => child.userData.localMarker);
            if (ring) ring.material.color.set(playerID === id ? 0xffca71 : 0x91a0c8);
          }
        }

        function upsertPlayer(player) {
          let group = objects.get(player.id);
          if (!group) {
            group = createPlayer(player);
            objects.set(player.id, group);
          }
          const avatarKey = `${player.avatarURL ?? ''}|${player.photoURL ?? ''}`;
          if (group.userData.avatarKey !== avatarKey) {
            group.userData.avatar.material.map.dispose();
            group.userData.avatar.material.map = avatarTexture(player);
            group.userData.avatarKey = avatarKey;
          }
          group.userData.target.set(player.x, 0, player.z);
          setLocalPlayer(selfID);
        }

        function removePlayer(id) {
          const group = objects.get(id);
          if (!group) return;
          scene.remove(group);
          group.traverse(object => {
            object.geometry?.dispose();
            object.material?.map?.dispose();
            object.material?.dispose();
          });
          objects.delete(id);
        }

        const resize = () => {
          const width = host.clientWidth;
          const height = host.clientHeight;
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        };
        new ResizeObserver(resize).observe(host);
        resize();
        world = { upsertPlayer, removePlayer, setLocalPlayer };
        for (const player of playerState.values()) upsertPlayer(player);
        setLocalPlayer(selfID);

        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          const delta = Math.min(clock.getDelta(), .1);
          const blend = 1 - Math.exp(-10 * delta);
          for (const [id, group] of objects) {
            if (id === selfID && heldDirections.size && socket?.readyState === WebSocket.OPEN) {
              const next = applyMove(group.position, activeDirection(), yaw, walkSpeed * delta);
              group.position.set(next.x, 0, next.z);
            } else {
              group.position.lerp(group.userData.target, blend);
            }
          }
          const local = objects.get(selfID);
          if (local) camera.position.set(local.position.x, eyeHeight, local.position.z);
          camera.rotation.set(pitch, yaw, 0, 'YXZ');
          renderer.render(scene, camera);
        });
        addDebug('three.js: first-person ready', 'muted');
      } catch {
        addDebug('three.js: renderer unavailable', 'muted');
      }
    }

    function sendMove(direction) {
      const time = performance.now();
      if (input.disabled || socket?.readyState !== WebSocket.OPEN || time - lastMoveAt < moveInterval) return;
      lastMoveAt = time;
      addDebug(`input: ${moveLabel[direction]} (${Math.round(-yaw * 180 / Math.PI)}°)`);
      socket.send(JSON.stringify({ type: 'move', direction, yaw }));
    }

    function activeDirection() {
      return [...heldDirections.values()].at(-1);
    }

    function beginMovement(source, direction) {
      if (input.disabled || socket?.readyState !== WebSocket.OPEN || heldDirections.has(source)) return;
      heldDirections.set(source, direction);
      sendMove(direction);
      if (!movementTimer) movementTimer = setInterval(() => {
        const active = activeDirection();
        if (active) sendMove(active);
      }, 16);
    }

    function endMovement(source) {
      heldDirections.delete(source);
      if (!heldDirections.size) {
        clearInterval(movementTimer);
        movementTimer = undefined;
      }
    }

    function stopAllMovement() {
      heldDirections.clear();
      clearInterval(movementTimer);
      movementTimer = undefined;
    }

    async function connect() {
      const telegram = window.Telegram?.WebApp;
      if (!guestMode && !telegram?.initData) {
        setStatus('Open Hideout from its link inside Telegram.', 'error');
        addDebug('auth: no Telegram init data', 'muted');
        return;
      }
      telegram?.ready();
      telegram?.expand();
      setStatus(guestMode ? 'Checking debug guest access…' : 'Checking Telegram access…');
      let response;
      try {
        response = guestMode ? await fetch('/auth/guest', {
          method: 'POST',
          credentials: 'same-origin',
        }) : await fetch('/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ initData: telegram.initData }),
          });
      } catch {
        setStatus('Could not reach Hideout. Retrying…', 'error');
        setTimeout(connect, 5000);
        return;
      }
      if (!response.ok) {
        setStatus(guestMode && response.status === 401 ? 'Guest credentials rejected. Reload and try again.' :
          response.status === 403 ? 'This account is not in an allowed group.' :
          response.status === 401 ? 'Telegram login could not be verified. Reopen Hideout.' :
          'Could not check group membership. Reopen Hideout.', 'error');
        return;
      }

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.onmessage = event => {
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        if (message.type === 'welcome') {
          selfID = message.selfID;
          const currentPlayers = new Set(message.players.map(player => player.id));
          for (const id of playerState.keys()) if (!currentPlayers.has(id)) removePlayer(id);
          for (const player of message.players) upsertPlayer(player);
          world?.setLocalPlayer(selfID);
          const self = playerState.get(selfID);
          setStatus(`Connected as ${self?.name ?? 'player'}`, 'connected');
          setConnected(true);
          if (guestMode) addDebug('auth: debug guest access', 'muted');
          addDebug(`server: joined at (${self.x.toFixed(2)}, ${self.z.toFixed(2)})`, 'server');
        } else if (message.type === 'player_joined') {
          upsertPlayer(message.player);
          addDebug(`server: ${message.player.name} joined`, 'server');
        } else if (message.type === 'player_left') {
          const player = playerState.get(message.id);
          removePlayer(message.id);
          if (player) addDebug(`server: ${player.name} left`, 'muted');
        } else if (message.type === 'move') {
          const player = playerState.get(message.id);
          upsertPlayer({
            id: message.id,
            name: player?.name ?? message.name,
            photoURL: player?.photoURL ?? null,
            avatarURL: player?.avatarURL ?? null,
            x: message.x,
            z: message.z,
          });
          addDebug(`server: ${message.name} ${moveLabel[message.direction]} → (${message.x.toFixed(2)}, ${message.z.toFixed(2)})`, 'server');
        } else if (message.type === 'chat') {
          addDebug(`sendchat(): ${message.name} ${message.text}`, 'chat');
          showBubble(message.name, message.text);
        }
      };
      socket.onclose = () => {
        setConnected(false);
        setStatus('Disconnected. Reconnecting…', 'error');
        addDebug('socket: disconnected', 'muted');
        setTimeout(connect, 1500);
      };
      socket.onerror = () => socket.close();
    }

    for (const button of moveButtons) {
      button.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        beginMovement(`pointer:${event.pointerId}`, button.dataset.direction);
      });
      for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        button.addEventListener(eventName, event => endMovement(`pointer:${event.pointerId}`));
      }
      button.addEventListener('click', event => {
        if (event.detail === 0) sendMove(button.dataset.direction);
      });
    }
    const keyDirection = {
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down',
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right',
    };
    document.addEventListener('keydown', event => {
      if (event.target === input || event.ctrlKey || event.metaKey || event.altKey) return;
      const direction = keyDirection[event.key];
      if (!direction) return;
      event.preventDefault();
      if (!event.repeat) beginMovement(`key:${event.code}`, direction);
    });
    document.addEventListener('keyup', event => {
      const direction = keyDirection[event.key];
      if (direction) endMovement(`key:${event.code}`);
    });
    window.addEventListener('blur', stopAllMovement);
    input.addEventListener('focus', stopAllMovement);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopAllMovement();
    });

    document.getElementById('chat-form').addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || socket?.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: 'chat', text }));
      input.value = '';
    });

    function updateClock() {
      document.getElementById('clock').textContent = `time ${new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' }).format(new Date())}`;
    }
    updateClock();
    setInterval(updateClock, 30000);
    addDebug('client: booting…', 'muted');
    startThree();
    connect();
  </script>
</body>
</html>
